apiVersion: aegis/v1
interval: 1s

recovery:
  dry_run: true

checks:
  camera_topic:
    type: topic
    target: /camera/image_raw
    stale_timeout: 1s
    expected_rate: 30

  robot_state:
    type: topic
    target: /robot/state
    stale_timeout: 500ms
    expected_rate: 20

  navigation_node:
    type: node
    target: /navigation
