[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2-device-watchdog"
version = "0.1.0"
description = "ROS2 device health monitoring tool"
requires-python = ">=3.10"
dependencies = [
    "rclpy",
    "pyyaml",
]
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
watchdog = "ros2_device_watchdog.node:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
