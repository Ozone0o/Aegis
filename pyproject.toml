[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.2.0"
description = "Aegis runtime protection and recovery framework for ROS 2 robots"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
